# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: publish
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docs/**'
      - 'README.md'
      - '.github/servicebus-emulator/**'
      - '.github/workflows/publish.yml'
  pull_request:
    branches: [ '*' ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docs/**'
      - 'README.md'
      - '.github/servicebus-emulator/**'
      - '.github/workflows/publish.yml'
  release:
    types: [ published ]

env:
  DOTNET_MULTILEVEL_LOOKUP: 0
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: 1
  DOTNET_NOLOGO: true
  NuGetDirectory: ${{ github.workspace }}/nuget

defaults:
  run:
    shell: pwsh

permissions: {}

jobs:
  build_test_pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          show-progress: false
      - name: Add AspNetZero NuGet source
        run: dotnet nuget add source "${{ secrets.ASPNETZERO_NUGET_URL }}" -n aspnetzero
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Fail on wildcard PackageReference versions in src/**
        run: |
          $offenders = Get-ChildItem -Path src -Recurse -Filter *.csproj |
            Select-String -Pattern '<PackageReference\b[^>]*\bVersion="[^"]*\*[^"]*"', '<Version>[^<]*\*[^<]*</Version>'
          if ($offenders) {
            $offenders | ForEach-Object { Write-Host "::error file=$($_.Path),line=$($_.LineNumber)::Wildcard PackageReference version: $($_.Line.Trim())" }
            throw 'Floating (x.y.*) PackageReference versions are not allowed under src/**. Pin explicit minimum versions so the published nuspec floors do not drift.'
          }
          Write-Host 'No wildcard PackageReference versions found under src/**.'
      - name: Restore
        run: |
          dotnet restore src/CommunityAbp.AspNetZero.DistributedEventBus.Core/CommunityAbp.AspNetZero.DistributedEventBus.Core.csproj
          dotnet restore src/CommunityAbp.AspNetZero.DistributedEventBus.AzureServiceBus/CommunityAbp.AspNetZero.DistributedEventBus.AzureServiceBus.csproj
          dotnet restore tests/CommunityAbp.AspNetZero.DistributedEventBus.Tests/CommunityAbp.AspNetZero.DistributedEventBus.Tests.csproj
          dotnet restore tests/CommunityAbp.AspNetZero.DistributedEventBus.NetStandard.Tests/CommunityAbp.AspNetZero.DistributedEventBus.NetStandard.Tests.csproj
      - name: Build (Release)
        run: |
          dotnet build src/CommunityAbp.AspNetZero.DistributedEventBus.Core/CommunityAbp.AspNetZero.DistributedEventBus.Core.csproj --configuration Release --no-restore /clp:ErrorsOnly
          dotnet build src/CommunityAbp.AspNetZero.DistributedEventBus.AzureServiceBus/CommunityAbp.AspNetZero.DistributedEventBus.AzureServiceBus.csproj --configuration Release --no-restore /clp:ErrorsOnly
          dotnet build tests/CommunityAbp.AspNetZero.DistributedEventBus.Tests/CommunityAbp.AspNetZero.DistributedEventBus.Tests.csproj --configuration Release --no-restore /clp:ErrorsOnly
          dotnet build tests/CommunityAbp.AspNetZero.DistributedEventBus.NetStandard.Tests/CommunityAbp.AspNetZero.DistributedEventBus.NetStandard.Tests.csproj --configuration Release --no-restore /clp:ErrorsOnly
      - name: Test
        run: dotnet test tests/CommunityAbp.AspNetZero.DistributedEventBus.Tests/CommunityAbp.AspNetZero.DistributedEventBus.Tests.csproj --configuration Release --no-build --filter 'FullyQualifiedName!~TestBase'
      - name: Test (netstandard2.0 build surface)
        run: dotnet test tests/CommunityAbp.AspNetZero.DistributedEventBus.NetStandard.Tests/CommunityAbp.AspNetZero.DistributedEventBus.NetStandard.Tests.csproj --configuration Release --no-build
      - name: Pack (no build)
        run: |
          mkdir -p ${{ env.NuGetDirectory }}
          dotnet pack src/CommunityAbp.AspNetZero.DistributedEventBus.Core/CommunityAbp.AspNetZero.DistributedEventBus.Core.csproj --configuration Release --no-build --output ${{ env.NuGetDirectory }} -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg
          dotnet pack src/CommunityAbp.AspNetZero.DistributedEventBus.AzureServiceBus/CommunityAbp.AspNetZero.DistributedEventBus.AzureServiceBus.csproj --configuration Release --no-build --output ${{ env.NuGetDirectory }} -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg
      - name: Assert nuspec dependency floors
        run: ./.github/scripts/Assert-NuspecFloors.ps1 -PackageDirectory '${{ env.NuGetDirectory }}'
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: |
            ${{ env.NuGetDirectory }}/*.nupkg
            ${{ env.NuGetDirectory }}/*.snupkg

  servicebus_emulator_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Start Azure Service Bus emulator
        run: docker compose -f .github/servicebus-emulator/docker-compose.yml up -d
      - name: Wait for emulator health
        run: |
          for ($i = 0; $i -lt 30; $i++) {
            try {
              if ((Invoke-WebRequest http://localhost:5300/health -UseBasicParsing).StatusCode -eq 200) { exit 0 }
            } catch { }
            Start-Sleep -Seconds 2
          }
          docker compose -f .github/servicebus-emulator/docker-compose.yml logs
          throw 'Azure Service Bus emulator did not become healthy.'
      - name: Run Service Bus emulator tests
        env:
          AZURE_SERVICEBUS_EMULATOR_CONNECTION: Endpoint=sb://localhost;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
        run: dotnet test tests/CommunityAbp.AspNetZero.DistributedEventBus.Tests/CommunityAbp.AspNetZero.DistributedEventBus.Tests.csproj --filter 'Category=ServiceBusEmulator'
      - name: Stop emulator
        if: always()
        run: docker compose -f .github/servicebus-emulator/docker-compose.yml down -v

  deploy:
    if: github.event_name == 'release'
    needs: build_test_pack
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5  # checkout FIRST so artifact download isn't wiped
        with:
          fetch-depth: 0
          show-progress: false
      - uses: actions/download-artifact@v5
        with:
          name: nuget
          path: ${{ env.NuGetDirectory }}
      - name: List downloaded packages
        run: |
          if (Test-Path '${{ env.NuGetDirectory }}') {
            Get-ChildItem '${{ env.NuGetDirectory }}' -Recurse | Write-Host
          } else { Write-Error 'NuGetDirectory missing after download.' }
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish NuGet packages
        run: |
          if (-not (Test-Path '${{ env.NuGetDirectory }}')) { throw 'NuGet directory not found.' }
          $pkgs = Get-ChildItem "${{ env.NuGetDirectory }}" -Recurse -Include *.nupkg
          if (-not $pkgs) { throw 'No .nupkg files found to publish.' }
          foreach($file in $pkgs) {
            dotnet nuget push $file --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
